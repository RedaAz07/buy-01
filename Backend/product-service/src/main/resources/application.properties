spring.config.import=optional:file:./.env[.properties]
spring.application.name=product-service
server.port=8082
spring.data.mongodb.uri=${MONGODB_URI}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=${JWT_EXPIRATION}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=${spring.application.name}-group
spring.kafka.consumer.auto-offset-reset=earliest

# Deserializers
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Enable Type Headers
spring.kafka.consumer.properties.spring.json.use.type.headers=true
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Map token header names to local DTO classes
spring.kafka.consumer.properties.spring.json.type.mapping=mediaUploaded:com.microservices.product_service.dto.event.MediaUploadedEvent,mediaDeleted:com.microservices.product_service.dto.event.DeleteMediaEvent

# Producer settings (if product-service produces events)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer