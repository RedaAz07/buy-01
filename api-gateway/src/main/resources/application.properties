spring.application.name=api-gateway
application.security.jwt.secret-key=${JWT_SECRET}
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**,/api/auth/**

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/products/**

        - id: media-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/media/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
