services:
  # MONGODB SERVICES
  user-db:
    image: mongo:7.0
    container_name: mongodb_user
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${USER_MONGO_INITDB_DATABASE}
    ports:
      - "27017:27017"
    volumes:
      - user_mongodb_data:/data/db

  media-db:
    image: mongo:7.0
    container_name: mongodb_media
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MEDIA_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MEDIA_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MEDIA_MONGO_INITDB_DATABASE}
    ports:
      - "27018:27017"
    volumes:
      - media_mongodb_data:/data/db

  product-db:
    image: mongo:7.0
    container_name: mongodb_product
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PRODUCT_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PRODUCT_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${PRODUCT_MONGO_INITDB_DATABASE}
    ports:
      - "27019:27017"
    volumes:
      - product_mongodb_data:/data/db

  # KAFKA & KAFKA UI
  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # JAVA MICROSERVICES
  registry:
    build:
      context: ./Backend/registry
    container_name: service-registry
    restart: unless-stopped
    ports:
      - "8761:8761"

  user-service:
    build:
      context: ./Backend/user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${USER_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${USER_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${USER_MONGO_INITDB_DATABASE}
      SERVER_PORT: ${USER_SERVER_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_MONGODB_HOST: user-db
      SPRING_MONGODB_PORT: 27017
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
    depends_on:
      - user-db
      - kafka
      - registry
    entrypoint: ["sh", "-c", "echo 'Simulating container crash!' && exit 1"]

  product-service:
    build:
      context: ./Backend/product-service
    container_name: product-service
    restart: unless-stopped
    environment:
      MONGODB_URI: ${PRODUCT_MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
    depends_on:
      - product-db
      - kafka
      - registry

  media-service:
    build:
      context: ./Backend/media-Service
    container_name: media-service
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MEDIA_MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MEDIA_MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MEDIA_MONGO_INITDB_DATABASE}
      SERVER_PORT: ${MEDIA_SERVER_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      CLOUDINARY_CLOUD_NAME: ${MEDIA_CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${MEDIA_CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${MEDIA_CLOUDINARY_API_SECRET}
      SPRING_DATA_MONGODB_HOST: media-db
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
    depends_on:
      - media-db
      - kafka
      - registry

  api-gateway:
    build:
      context: ./Backend/api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SSL_Pass: ${API_GATEWAY_SSL_PASS}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry:8761/eureka/
    depends_on:
      - registry
      - user-service
      - product-service
      - media-service
      - redis
    ports:
      - "8443:8443"

  # FRONTEND (ANGULAR + NGINX)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8444:443"

    depends_on:
      - api-gateway

volumes:
  user_mongodb_data:
  media_mongodb_data:
  product_mongodb_data:
  kafka_data:
  redis_data:

networks:
  default:
    name: buy-network
