<app-navbar></app-navbar>
<section class="product-detail" *ngIf="products() as product">

    <div *ngIf="show" class="update-card">
        <div class="card-inner">

            <div class="card-header">
                <h2>Update Product</h2>
                <button class="close-btn" (click)="show = false">&times;</button>
            </div>
            <form (ngSubmit)="updetProduct()">
                <div class="field-wrapper">
                    <label class="field-label">Name</label>
                    <input matInput formControlName="name" placeholder="Product name" value={{product.name}} />

                </div>

                <div class="field-wrapper">
                    <label class="field-label">Description</label>
                    <textarea matInput formControlName="description" placeholder="Product description"
                        rows="3" value={{product.description}}></textarea>
                </div>

                <div class="field-row">
                    <div class="field-wrapper1">
                        <label class="field-label">Price</label>
                        <input matInput type="number" formControlName="price" placeholder="0.00" value={{product.price}}/>

                    </div>

                    <div class="field-wrapper1">
                        <label class="field-label">Quantity</label>
                        <input matInput type="number" formControlName="quantity" placeholder="0" value={{product.quantity}} />
                    </div>
                </div>
                <button class="submit-btn" type="submit">
                    Update Product
                </button>
            </form>
        </div>
    </div>
    <div class="detail-container">
        <div class="gallery">
            <img class="main-image" [src]="product.imageUrls[0] || 'http://localhost:4200/assets/noProducts.png'"
                [alt]="product.name" />
            <div class="thumbnails" *ngIf="product.imageUrls.length > 1">
                <img *ngFor="let img of product.imageUrls" [src]="img" [alt]="product.name" class="thumb" />
            </div>
        </div>

        <div class="info">
            <div class="tag-top">
                <span class="hole"></span>
                <span class="serial">No. {{ lotNo(product.id) }}</span>
            </div>
            <div class="title-row">
                <h1 class="name">{{ product.name }}</h1>
                @if(user();as currentUser ){
                <div class="owner-actions" *ngIf="products()?.sellerId===currentUser.id">
                    <button class="btn-delete" (click)="deleteProduct()" title="Delete">✕</button>
                    <button class="btn-edit" (click)="show=!show" title="Edit">✎</button>
                </div>
                }
            </div>
            <p class="description">{{ product.description }}</p>

            <div class="price-row">
                <span class="price">${{ product.price }}</span>
                <span class="stock" [class.out]="product.quantity === 0">
                    {{ product.quantity > 0 ? product.quantity + ' in stock' : 'Out of stock' }}
                </span>
            </div>

            <div class="actions">
                <button class="btn-primary" [disabled]="product.quantity === 0">Add to Cart</button>
                @if(user();as currentUser ){

                <button *ngIf="products()?.sellerId===currentUser.id" class="btn-secondary"
                    (click)="updetProduct()">update
                    product</button>
                }
            </div>
        </div>
    </div>
</section>
