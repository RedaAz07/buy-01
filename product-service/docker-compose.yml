services:
  mongodb:
    image: mongo:latest
    container_name: product-service
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DBUSERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DBPASSWORD}
      MONGO_INITDB_DATABASE: ${DBNAME}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
